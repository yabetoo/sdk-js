name: Publish @yabetoo/sdk-js to npm

on:
  push:
    tags:
      - "v*.*.*" # ex: v0.1.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version:       $TAG"
          echo "package.json name: $PKG_NAME"
          echo "package.json ver:  $PKG_VERSION"

          if [ "$PKG_NAME" != "@yabetoo/sdk-js" ]; then
            echo "ERROR: package name mismatch. Expected @yabetoo/sdk-js"
            exit 1
          fi

          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag (v$TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: npm run build --if-present

      - name: Publish to npm (public)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}